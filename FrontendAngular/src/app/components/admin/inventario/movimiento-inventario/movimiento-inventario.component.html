<div class="layout-sidebar">
  <app-sidebar rol="admin"></app-sidebar>

  <main class="main-content">
    <app-breadcrumb></app-breadcrumb>

    <div class="mb-lg page-header">
      <a routerLink="/admin/inventario" class="btn btn-text volver-link">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        Volver a inventario
      </a>
      <h1 class="page-title">{{ titulo }}</h1>
      <p class="text-muted page-subtitle">{{ subtitulo }}</p>
    </div>

    <form (ngSubmit)="guardar()">
      <div class="card futuristic-card">
        <h3 class="mb-md section-title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/>
          </svg>
          Datos del movimiento
        </h3>

        <div class="form-group">
          <label class="form-label">Producto *</label>
          <select class="form-select" [(ngModel)]="productoId" name="producto" required [disabled]="loading">
            <option value="">Seleccionar producto</option>
            @for (producto of productos; track producto.id) {
              <option [value]="producto.id.toString()">{{ producto.nombre }} (Stock: {{ producto.stock }})</option>
            }
          </select>
          @if (loading) {
            <p class="text-small text-muted mt-xs">Cargando productos...</p>
          }
        </div>

        <div class="form-group">
          <label class="form-label">Cantidad *</label>
          <input type="number" class="form-input" [(ngModel)]="cantidad" name="cantidad"
                 placeholder="0" min="1" required>
        </div>

        <div class="form-group">
          <label class="form-label">Notas (opcional)</label>
          <textarea class="form-input" [(ngModel)]="notas" name="notas" rows="2"
                    placeholder="Razón del movimiento..."></textarea>
        </div>

        <div class="form-actions mt-lg">
          <button type="button" class="btn btn-secondary" (click)="volver()">Cancelar</button>
          <button type="submit" class="btn btn-primary" [disabled]="guardando || loading">
            {{ labelBoton }}
          </button>
        </div>
      </div>
    </form>
  </main>
</div>

<!-- Mobile Nav -->
<nav class="navbar-mobile">
  <a routerLink="/admin" class="navbar-mobile-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
      <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
    </svg>
    Dashboard
  </a>
  <a routerLink="/admin/inventario" class="navbar-mobile-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/>
    </svg>
    Inventario
  </a>
  <a routerLink="/admin/productos" class="navbar-mobile-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="7" y="6" width="10" height="14" rx="3"/><path d="M10 6V4h4v2"/><line x1="9" y1="11" x2="15" y2="11"/><line x1="10" y1="15" x2="14" y2="15"/>
    </svg>
    Productos
  </a>
  <a routerLink="/admin/configuracion" class="navbar-mobile-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="3"/>
    </svg>
    Config
  </a>
</nav>
