<div class="auth-page login-shell">
  <div class="auth-page__glow auth-page__glow--1" aria-hidden="true"></div>
  <div class="auth-page__glow auth-page__glow--2" aria-hidden="true"></div>

  <div class="auth-toolbar">
    <button
      type="button"
      class="auth-theme-toggle"
      (click)="theme.toggle()"
      [attr.aria-label]="theme.isDark() ? 'Activar modo claro' : 'Activar modo oscuro'"
    >
      @if (theme.isDark()) {
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
      } @else {
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
        </svg>
      }
    </button>
  </div>

  <div class="auth-layout">
    <div class="auth-card login-card">
      <a routerLink="/" class="auth-back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M19 12H5M12 19l-7-7 7-7" />
        </svg>
        Volver al inicio
      </a>

      <div class="login-brand-block">
        <div class="auth-logo-mark" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="6" cy="6" r="3" />
            <circle cx="6" cy="18" r="3" />
            <line x1="20" y1="4" x2="8.12" y2="15.88" />
            <line x1="14.47" y1="14.48" x2="20" y2="20" />
            <line x1="8.12" y1="8.12" x2="12" y2="12" />
          </svg>
        </div>
        <p class="auth-brand">Stylo <span>Barber</span></p>
      </div>

      <div class="auth-eyebrow">
        <span class="auth-eyebrow__dot"></span>
        Acceso seguro
      </div>
      <h1 class="auth-title">Iniciar sesión</h1>
      <p class="auth-sub">Entra con tu cuenta o continúa con Google.</p>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
        <div class="form-row">
          <label for="email" class="input-label">Correo o usuario</label>
          <div class="input-wrapper">
            <input
              id="email"
              type="text"
              formControlName="email"
              placeholder="juan@example.com o juan123"
              class="input-field"
              autocomplete="username"
              [class.input-error]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
              [class.input-success]="loginForm.get('email')?.valid"
            >
            <div class="input-feedback" *ngIf="loginForm.get('email')?.hasError('required') && loginForm.get('email')?.touched">
              El correo o usuario es obligatorio
            </div>
          </div>
        </div>

        <div class="form-row">
          <label for="password" class="input-label">Contraseña</label>
          <div class="input-wrapper password-wrapper">
            <input
              id="password"
              type="password"
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
              class="input-field input-field-password"
              autocomplete="current-password"
              [class.input-error]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
            >
            <button
              type="button"
              class="password-toggle"
              (click)="togglePassword()"
              [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Ver contraseña'"
              title="{{ showPassword ? 'Ocultar contraseña' : 'Ver contraseña' }}"
            >
              @if (showPassword) {
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                  <path
                    d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
                  />
                  <line x1="1" y1="1" x2="23" y2="23" />
                </svg>
              } @else {
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              }
            </button>
            <div class="input-feedback error" *ngIf="loginForm.get('password')?.hasError('required') && loginForm.get('password')?.touched">
              La contraseña es obligatoria
            </div>
          </div>
        </div>

        <div class="forgot-password-link">
          <a routerLink="/forgot-password">¿Olvidaste tu contraseña?</a>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary btn--premium-primary submit-button" [disabled]="loading || loginForm.invalid">
            <span *ngIf="!loading">Iniciar sesión</span>
            <span *ngIf="loading" class="spinner"></span>
          </button>
        </div>

        <div class="login-divider"><span>o continúa con</span></div>

        <div class="google-login">
          <button type="button" class="auth-btn-google" (click)="loginWithGoogle()" [disabled]="loadingGoogle">
            <span *ngIf="!loadingGoogle" class="google-btn-content">
              <svg class="google-logo" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                <path
                  fill="#4285F4"
                  d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                />
                <path
                  fill="#34A853"
                  d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                />
                <path
                  fill="#FBBC05"
                  d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                />
                <path
                  fill="#EA4335"
                  d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                />
              </svg>
              Iniciar con Google
            </span>
            <span *ngIf="loadingGoogle" class="spinner"></span>
          </button>
        </div>

        <div class="auth-footer-link">
          <p>¿No tienes cuenta? <a routerLink="/register">Regístrate aquí</a></p>
        </div>
      </form>
    </div>
  </div>
</div>
