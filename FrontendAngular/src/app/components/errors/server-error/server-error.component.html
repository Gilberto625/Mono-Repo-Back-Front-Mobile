<app-navbar [isLoggedIn]="false"></app-navbar>

<div class="error-container">
  <div class="error-content">
    <div class="error-illustration">
      <svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Broken barber pole -->
        <rect x="150" y="50" width="100" height="200" fill="url(#brokenGradient)" rx="10" opacity="0.5"/>
        <line x1="200" y1="50" x2="200" y2="250" stroke="#ff4444" stroke-width="3" stroke-dasharray="5,5"/>
        <defs>
          <linearGradient id="brokenGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:0.3" />
            <stop offset="50%" style="stop-color:#ff4444;stop-opacity:0.5" />
            <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:0.3" />
          </linearGradient>
        </defs>
        <!-- Error symbol -->
        <circle cx="200" cy="150" r="60" fill="none" stroke="#ff4444" stroke-width="4" opacity="0.5"/>
        <line x1="170" y1="120" x2="230" y2="180" stroke="#ff4444" stroke-width="4" stroke-linecap="round"/>
        <line x1="230" y1="120" x2="170" y2="180" stroke="#ff4444" stroke-width="4" stroke-linecap="round"/>
        <!-- Warning text -->
        <text x="200" y="240" font-family="Arial" font-size="16" fill="#ff4444" text-anchor="middle" opacity="0.7">ERROR</text>
      </svg>
    </div>
    
    <div class="error-code">{{ errorCode }}</div>
    <h1 class="error-title">{{ errorTitle }}</h1>
    <p class="error-message">{{ errorMessage }}</p>
    
    <div class="error-actions">
      <a routerLink="/" class="btn btn-primary">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        Volver al Inicio
      </a>
      <button (click)="goBack()" class="btn btn-secondary">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        Página Anterior
      </button>
      <a routerLink="/servicios" class="btn btn-text">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="6" cy="6" r="3"/>
          <path d="M6 9v12"/>
          <path d="M13 6l-3 9 7 4"/>
        </svg>
        Ver Servicios
      </a>
    </div>
    
    <div class="error-help">
      <p class="text-small">Por favor, intenta nuevamente en unos momentos. Si el problema persiste, <a href="mailto:soporte@stylobarber.com">contáctanos</a>.</p>
    </div>
  </div>
</div>

<app-footer></app-footer>
