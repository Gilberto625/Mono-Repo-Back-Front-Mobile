<app-navbar [isLoggedIn]="false"></app-navbar>

<div class="error-container">
  <div class="error-content">
    <div class="error-illustration">
      <svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Barber pole illustration -->
        <rect x="150" y="50" width="100" height="200" fill="url(#barberGradient)" rx="10"/>
        <defs>
          <linearGradient id="barberGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:1" />
            <stop offset="33%" style="stop-color:#1a1a1a;stop-opacity:1" />
            <stop offset="66%" style="stop-color:#D4AF37;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
          </linearGradient>
        </defs>
        <!-- Scissors -->
        <path d="M120 100 L140 120 L130 130 L110 110 Z" fill="#D4AF37" opacity="0.7"/>
        <path d="M280 100 L260 120 L270 130 L290 110 Z" fill="#D4AF37" opacity="0.7"/>
        <!-- Question mark -->
        <text x="200" y="180" font-family="Arial" font-size="80" font-weight="bold" fill="#D4AF37" text-anchor="middle">?</text>
      </svg>
    </div>
    
    <div class="error-code">{{ errorCode }}</div>
    <h1 class="error-title">{{ errorTitle }}</h1>
    <p class="error-message">{{ errorMessage }}</p>
    
    <div class="error-actions">
      <a routerLink="/" class="btn btn-primary">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        Volver al Inicio
      </a>
      <a routerLink="/servicios" class="btn btn-secondary">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="6" cy="6" r="3"/>
          <path d="M6 9v12"/>
          <path d="M13 6l-3 9 7 4"/>
        </svg>
        Ver Servicios
      </a>
      <button (click)="goBack()" class="btn btn-text">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        Página Anterior
      </button>
    </div>
    
    <div class="error-help">
      <p class="text-small">¿Necesitas ayuda? <a routerLink="/login">Inicia sesión</a> o <a routerLink="/register">regístrate</a></p>
    </div>
  </div>
</div>

<app-footer></app-footer>
