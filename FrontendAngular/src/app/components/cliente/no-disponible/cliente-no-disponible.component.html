<div class="layout-sidebar">
  <app-sidebar rol="cliente"></app-sidebar>

  <main class="main-content">
    <app-breadcrumb></app-breadcrumb>
    <h1 class="mb-md">Página no disponible</h1>
    <p class="text-muted mb-lg">Esta sección aún no está disponible. Usa el menú para navegar.</p>

    <div class="card text-center">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="var(--text-on-dark-tertiary)" stroke-width="1" style="margin: 0 auto var(--spacing-lg);">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <h3 class="mb-md">Esta página aún no está disponible</h3>
      <p class="text-muted mb-lg">Puedes volver al inicio, ver servicios o productos desde aquí.</p>
      <div class="flex-between flex-gap" style="flex-wrap: wrap; justify-content: center; gap: var(--spacing-md);">
        <a routerLink="/cliente" class="btn btn-primary">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          </svg>
          Volver al inicio
        </a>
        <a routerLink="/cliente/servicios" class="btn btn-secondary">Ver servicios</a>
        <a routerLink="/cliente/productos" class="btn btn-secondary">Ver productos</a>
      </div>
    </div>
  </main>
</div>
