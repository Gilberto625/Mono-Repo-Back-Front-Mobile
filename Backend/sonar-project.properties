
# Debe coincidir con el "Project key" del proyecto en SonarCloud.
# Si lo importaste desde GitHub, suele ser: organización_repo (ej: Gilberto625_BackendStyloBarberConect)
sonar.projectKey=Gilberto625_BackendStyloBarberConect
sonar.projectName=Stylo Barber Connect — Backend API
sonar.projectVersion=1.0
# Clave de tu organización en SonarCloud (solo el id, ej: Gilberto625)
# Si importaste el repo desde GitHub, la org suele ser tu usuario o el nombre de la org.
sonar.organization=Gilberto625
# Rama que se analiza; ayuda a que SonarCloud tenga una rama por defecto desde el primer análisis
sonar.branch.name=main
sonar.sourceEncoding=UTF-8
sonar.sources=.
sonar.language=python
# Excluir: caché, migraciones, archivos generados, sqlite, env con secretos
sonar.exclusions=\
  **/__pycache__/**, \
  **/migrations/**, \
  **/*.pyc, \
  db.sqlite3, \
  .env copy, \
  env.example, \
  bootstrap/tests.py
# Cobertura de tests (pytest --cov genera esto)
sonar.python.coverage.reportPaths=coverage.xml
# Reporte Bandit
sonar.python.bandit.reportPaths=bandit-report.json
# Quality Gate: bloquea el pipeline si hay vulnerabilidades críticas
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300