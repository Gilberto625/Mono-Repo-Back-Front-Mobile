name: CI

on:
  push:
    branches:
      - main
      - master
      - 'codex/**'
  pull_request:

jobs:
  backend:
    name: Backend check & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    env:
      SECRET_KEY: ci-test-secret-key-for-checks-only-32chars
      DEBUG: 'False'
      USE_LOCAL_DB: 'True'
      CLIP_WEBHOOK_SECRET: ci-webhook-secret-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Django check
        run: python manage.py check
      - name: Django tests
        run: python manage.py test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FrontendAngular
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: FrontendAngular/.nvmrc
          cache: npm
          cache-dependency-path: FrontendAngular/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build

  # E2E Playwright contra Neon staging: job manual futuro (requiere secretos E2E_STAGING_*).
